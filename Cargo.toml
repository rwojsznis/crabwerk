# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "crabwerk"
# Internal Cargo version. Release binaries get their version from the Git tag.
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
description = "A CLI for working with packs (modular code organization) in Ruby codebases."
license = "MIT"
repository = "https://github.com/rwojsznis/crabwerk"
publish = false

# `dbg!` output goes to stderr, where it corrupts the report. The lint is in
# clippy's `restriction` group, so it is off unless asked for.
[lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Shipped binaries are stripped, which leaves a flamegraph with no method names.
# Profile with `cargo build --profile profiling` instead of un-stripping release.
[profile.profiling]
inherits = "release"
strip = "none"
debug = true

[[bin]]
name = "crabwerk"
path = "src/main.rs"

[lib]
name = "crabwerk"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1.0.75", features = [] }                         # for error handling
clap = { version = "4.2.1", features = ["derive"] }                    # cli
clap_derive = "4.2.0"                                                  # cli
itertools = "0.13.0"                                                   # tools for iterating over iterable things
jwalk = "0.8.1"                                                        # for walking the file tree
rayon = "1.7.0"                                                        # for parallel iteration
regex = "1.7.3"
serde = { version = "~1", features = ["derive"] }                      # de(serialization)
serde_yaml = "0.9.19"                                                  # de(serialization)
serde_json = "1.0.96"                                                  # de(serialization)
tracing = "0.1.37"                                                     # logging
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] } # logging
glob = "0.3.1"                                                         # globbing
globset = "0.4.18"                                                     # globbing
ruby-prism = "1.9.0"                                                   # ruby parser
line-col = "0.2.1"                                                     # for creating source maps of violations
ruby_inflector = '0.0.8'                                               # for inflecting strings, e.g. turning `has_many :companies` into `Company`
petgraph = "0.6.3"                                                     # for running graph algorithms (e.g. does the dependency graph contain a cycle?)
fnmatch-regex2 = "0.4.0"                                               # for compiling the `enforcement_globs_ignore` globs in `package.yml`, which use fnmatch syntax

[dev-dependencies]
assert_cmd = "2.0.10"       # testing CLI
predicates = "3.0.2"        # kind of like rspec assertions
pretty_assertions = "1.3.0" # Shows a more readable diff when comparing objects
serial_test = "3.1.1"       # Run specific tests in serial
tempfile = "3.8.0"          # temporary files and directories for testing
